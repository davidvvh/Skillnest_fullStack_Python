{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <h2 class="mb-4">Agregar Nuevo Libro</h2>

        {% with messages = get_flashed_messages(category_filter=['book_error']) %}
            {% if messages %}
                {% for msg in messages %}
                    <div class="alert alert-danger py-1 fs-6">{{ msg }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('book.create') }}" method="POST" class="bg-white p-4 rounded shadow-sm">
            <div class="mb-3">
                <label class="form-label">Título:</label>
                <input type="text" name="title" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Autor:</label>
                <input type="text" name="author" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Género:</label>
                <select name="genre" class="form-select" required>
                    <option value="" selected disabled>Selecciona un género</option>
                    <option value="Novela">Novela</option>
                    <option value="Fábula">Fábula</option>
                    <option value="Ciencia Ficción">Ciencia Ficción</option>
                    <option value="Romance">Romance</option>
                    <option value="Desarrollo Personal">Desarrollo Personal</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Fecha de publicación:</label>
                <input type="date" name="publication_date" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Descripción:</label>
                <textarea name="description" class="form-control" rows="4" required></textarea>
            </div>
            <button type="submit" class="btn btn-dark">Guardar</button>
            <a href="{{ url_for('book.dashboard') }}" class="btn btn-link text-decoration-none">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
