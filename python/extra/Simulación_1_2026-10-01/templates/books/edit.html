{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <h2 class="mb-4">Editar Libro</h2>

        {% with messages = get_flashed_messages(category_filter=['book_error']) %}
            {% if messages %}
                {% for msg in messages %}
                    <div class="alert alert-danger py-1 fs-6">{{ msg }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('book.edit', book_id=book.id) }}" method="POST" class="bg-white p-4 rounded shadow-sm">
            <div class="mb-3">
                <label class="form-label">Título:</label>
                <input type="text" name="title" value="{{ book.title }}" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Autor:</label>
                <input type="text" name="author" value="{{ book.author }}" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Género:</label>
                <select name="genre" class="form-select" required>
                    <option value="Novela" {% if book.genre == 'Novela' %}selected{% endif %}>Novela</option>
                    <option value="Fábula" {% if book.genre == 'Fábula' %}selected{% endif %}>Fábula</option>
                    <option value="Ciencia Ficción" {% if book.genre == 'Ciencia Ficción' %}selected{% endif %}>Ciencia Ficción</option>
                    <option value="Romance" {% if book.genre == 'Romance' %}selected{% endif %}>Romance</option>
                    <option value="Desarrollo Personal" {% if book.genre == 'Desarrollo Personal' %}selected{% endif %}>Desarrollo Personal</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Fecha de publicación:</label>
                <input type="date" name="publication_date" value="{{ book.publication_date }}" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Descripción:</label>
                <textarea name="description" class="form-control" rows="4" required>{{ book.description }}</textarea>
            </div>
            <button type="submit" class="btn btn-dark">Actualizar</button>
            <a href="{{ url_for('book.dashboard') }}" class="btn btn-link text-decoration-none">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
