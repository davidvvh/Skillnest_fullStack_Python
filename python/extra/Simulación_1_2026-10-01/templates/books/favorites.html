{% extends 'base.html' %}
{% block content %}
<h2 class="mb-4">Mis Libros Favoritos</h2>

<table class="table table-bordered bg-white shadow-sm align-middle">
    <thead class="table-light">
        <tr>
            <th>Título</th>
            <th>Autor</th>
            <th>Género</th>
            <th>Fecha</th>
            <th>Acción</th>
        </tr>
    </thead>
    <tbody>
        {% for book in books %}
        <tr>
            <td>{{ book.title }}</td>
            <td>{{ book.author }}</td>
            <td>{{ book.genre }}</td>
            <td>{{ book.publication_date }}</td>
            <td>
                <a href="{{ url_for('book.detail', book_id=book.id) }}" class="text-decoration-none">Ver</a>
            </td>
        </tr>
        {% else %}
        <tr><td colspan="5" class="text-center text-muted">Aún no has agregado ningún libro a tus favoritos.</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
